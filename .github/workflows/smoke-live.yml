name: Live endpoint smoke test

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - name: Check representative live endpoint families
        run: python scripts/smoke_live.py
