[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pga-tour-unofficial-api"
version = "0.3.7"
description = "Unofficial raw and DataFrame clients for PGA TOUR browser-facing data APIs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "Ruben Violinha"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.25.0",
  "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.30",
  "build>=1.2",
]

[project.urls]
Repository = "https://github.com/rubenviolinha/pga-tour-unofficial-api"
Documentation = "https://github.com/rubenviolinha/pga-tour-unofficial-api/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
pga_tour_api = ["queries/*.graphql", "graphql/*.graphql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
