[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pga-tour-unofficial-api"
version = "0.1.0"
description = "Unofficial Python client and reference for PGA TOUR browser-facing data APIs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "Ruben Violinha"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/rubenviolinha/pga-tour-unofficial-api"
Documentation = "https://github.com/rubenviolinha/pga-tour-unofficial-api/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
pga_tour_api = ["queries/*.graphql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
