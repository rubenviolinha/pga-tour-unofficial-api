site_name: PGA TOUR Unofficial API
site_description: Unofficial reference and Python client for PGA TOUR browser-facing data APIs
site_url: https://rubenviolinha.github.io/pga-tour-unofficial-api/
repo_url: https://github.com/rubenviolinha/pga-tour-unofficial-api
repo_name: rubenviolinha/pga-tour-unofficial-api

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Client reference:
      - DataFrame API: dataframe-api.md
      - Raw client: python-client.md
  - Data guide:
      - Return schemas: data-models.md
      - Statistics catalog: stats-catalog.md
      - Raw endpoints: endpoints.md
  - Validation: validation.md
  - Troubleshooting: troubleshooting.md
  - Development and testing: development.md
  - Responsible use: responsible-use.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_if_no_docstring: true
            show_signature_annotations: true
            members_order: source
            docstring_style: google

hooks:
  - scripts/docs_catalog.py

extra_javascript:
  - assets/stats-catalog.js
extra_css:
  - stylesheets/extra.css
  - assets/stats-catalog.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

copyright: Unofficial project. Not affiliated with or endorsed by PGA TOUR.
