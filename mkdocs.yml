site_name: PGA TOUR Unofficial API
site_description: Unofficial reference and Python client for PGA TOUR browser-facing data APIs
site_url: https://rubenviolinha.github.io/pga-tour-unofficial-api/
repo_url: https://github.com/rubenviolinha/pga-tour-unofficial-api
repo_name: rubenviolinha/pga-tour-unofficial-api

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Python client: python-client.md
  - Raw endpoints: endpoints.md
  - Validation: validation.md
  - Responsible use: responsible-use.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

copyright: Unofficial project. Not affiliated with or endorsed by PGA TOUR.
