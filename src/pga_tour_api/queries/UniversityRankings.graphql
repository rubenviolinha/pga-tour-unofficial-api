query UniversityRankings($year: Int, $week: Int) {
  universityRankings(year: $year, week: $week) {
    year displayYear throughText description disclaimer weekNum title sponsorName sponsorImage
    yearPills { year displaySeason } weekPills { week displayWeek }
    players { playerId rank rankColor rankingMovement rankingMovementAmount rankingMovementAmountSort displayName schoolName country wins top10 avg events tournaments { playedYear name finishPosition points week } }
  }
}
